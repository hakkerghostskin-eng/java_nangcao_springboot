<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập | Trà Sữa</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="account-page">
    <main class="account-card">
        <a class="account-brand" th:href="@{/}">TRÀ SỮA</a>
        <p class="account-eyebrow">Chào mừng bạn trở lại</p>
        <h1>Đăng nhập</h1>
        <p class="account-intro">Đăng nhập để tiếp tục trải nghiệm cùng Trà Sữa.</p>

        <div class="form-success" th:if="${thongBao}" th:text="${thongBao}" role="status"></div>
        <div class="form-alert" th:if="${loiDangNhap}" th:text="${loiDangNhap}" role="alert"></div>

        <form class="account-form" th:action="@{/dang-nhap}" method="post">
            <div class="form-field">
                <label for="taiKhoan">Email hoặc số điện thoại</label>
                <input id="taiKhoan" name="taiKhoan" type="text" autocomplete="username" required>
                <small class="field-error" ></small>
            </div>
            <div class="form-field">
                <label for="matKhau">Mật khẩu</label>
                <input id="matKhau" name="matKhau" type="password" autocomplete="current-password" required>
                <small class="field-error"></small>
            </div>
            <button class="account-submit" type="submit">Đăng nhập</button>
        </form>

        <p class="account-switch">Chưa có tài khoản? <a th:href="@{/dang-ky}">Đăng ký ngay</a></p>
        <a class="account-forgot-link" th:href="@{/quen-mat-khau}">Quên mật khẩu?</a>
        <a class="account-back" th:href="@{/}">← Trở về cửa hàng</a>
    </main>
</body>
</html>
